<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script src="bridge.js?v=397189af83"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRP 回測系統 - 參數調整與回測</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="static/backtest_view.js?v=397189af83"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .formula-box { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
        }
        .param-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .metric-card {
            transition: all 0.3s ease;
        }
        .metric-card:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800">MRP 生產預測回測系統</h1>
                        <p class="text-sm text-gray-500">參數調整與回測分析</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="records.html" class="bg-white border border-indigo-300 text-indigo-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-50 transition-all">
                        回測紀錄
                    </a>
                    <a href="demand-planning.html" class="bg-gradient-to-r from-green-500 to-teal-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:from-green-600 hover:to-teal-700 transition-all">
                        需求計劃公式
                    </a>
                    <div id="data-info" class="text-sm text-gray-500">
                        載入中...
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左側：參數設定 -->
            <div class="lg:col-span-1 space-y-6">
                <!-- 回測設定 -->
                <div class="bg-white rounded-xl shadow-sm p-6 card-hover transition-all duration-300">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        回測設定
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">資料來源</label>
                            <select id="dataset-select" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="sellin">Sell-in 銷貨淨額（通路 × 系列，元）</option>
                                <option value="sellout">Sell-out 銷貨數量（通路 × 料號，個）</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">通路選擇</label>
                            <select id="channel-select" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="ALL">全部通路</option>
                            </select>
                        </div>
                        
                        <div>
                            <label id="series-label" class="block text-sm font-medium text-gray-700 mb-1">商品系列</label>
                            <select id="series-select" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="ALL">全部系列</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">
                                訓練期 (月)
                                <span id="training-months-value" class="text-indigo-600 font-semibold ml-2">24</span>
                            </label>
                            <input type="range" id="training-months" min="12" max="36" value="24" step="1"
                                   class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer param-slider">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">
                                預測期 (月)
                                <span id="forecast-months-value" class="text-indigo-600 font-semibold ml-2">3</span>
                            </label>
                            <input type="range" id="forecast-months" min="1" max="6" value="3" step="1"
                                   class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer param-slider">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">
                                滾動輪數
                                <span id="rolling-rounds-value" class="text-indigo-600 font-semibold ml-2">12</span>
                            </label>
                            <input type="range" id="rolling-rounds" min="6" max="24" value="12" step="1"
                                   class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer param-slider">
                        </div>
                    </div>
                </div>

                <!-- 預測方法選擇 -->
                <div class="bg-white rounded-xl shadow-sm p-6 card-hover transition-all duration-300">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                        </svg>
                        預測方法
                    </h2>
                    
                    <div class="space-y-2">
                        <label class="flex items-center p-3 bg-gray-50 rounded-lg cursor-pointer hover:bg-indigo-50 transition-colors">
                            <input type="radio" name="method" value="Naive" class="text-indigo-600 focus:ring-indigo-500">
                            <span class="ml-3 text-sm font-medium text-gray-700">Naïve (天真法)</span>
                        </label>
                        <label class="flex items-center p-3 bg-gray-50 rounded-lg cursor-pointer hover:bg-indigo-50 transition-colors">
                            <input type="radio" name="method" value="Seasonal_Naive" class="text-indigo-600 focus:ring-indigo-500">
                            <span class="ml-3 text-sm font-medium text-gray-700">Seasonal Naïve (季節性天真法)</span>
                        </label>
                        <label class="flex items-center p-3 bg-gray-50 rounded-lg cursor-pointer hover:bg-indigo-50 transition-colors">
                            <input type="radio" name="method" value="SMA" checked class="text-indigo-600 focus:ring-indigo-500">
                            <span class="ml-3 text-sm font-medium text-gray-700">SMA (簡單移動平均)</span>
                        </label>
                        <label class="flex items-center p-3 bg-gray-50 rounded-lg cursor-pointer hover:bg-indigo-50 transition-colors">
                            <input type="radio" name="method" value="SES" class="text-indigo-600 focus:ring-indigo-500">
                            <span class="ml-3 text-sm font-medium text-gray-700">SES (簡單指數平滑)</span>
                        </label>
                        <label class="flex items-center p-3 bg-gray-50 rounded-lg cursor-pointer hover:bg-indigo-50 transition-colors">
                            <input type="radio" name="method" value="Holt" class="text-indigo-600 focus:ring-indigo-500">
                            <span class="ml-3 text-sm font-medium text-gray-700">Holt (雙參數指數平滑)</span>
                        </label>
                        <label class="flex items-center p-3 bg-indigo-50 rounded-lg cursor-pointer hover:bg-indigo-100 transition-colors border-2 border-indigo-200">
                            <input type="radio" name="method" value="HoltWinters" class="text-indigo-600 focus:ring-indigo-500">
                            <span class="ml-3 text-sm font-medium text-gray-700">Holt-Winters ⭐推薦</span>
                        </label>
                        <label class="flex items-center p-3 bg-green-50 rounded-lg cursor-pointer hover:bg-green-100 transition-colors border-2 border-green-200">
                            <input type="radio" name="method" value="WeightedMA" class="text-green-600 focus:ring-green-500">
                            <span class="ml-3 text-sm font-medium text-gray-700">需求計劃公式（現行 MA 加權）</span>
                        </label>
                    </div>
                </div>

                <!-- 方法參數 -->
                <div id="method-params" class="bg-white rounded-xl shadow-sm p-6 card-hover transition-all duration-300">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                        </svg>
                        方法參數
                    </h2>
                    <div id="params-container" class="space-y-4">
                        <!-- 動態生成參數 -->
                    </div>
                </div>

                <!-- 執行按鈕 -->
                <div class="flex space-x-3">
                    <button id="run-backtest" class="flex-1 bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-3 px-6 rounded-lg font-medium hover:from-indigo-600 hover:to-purple-700 transition-all duration-300 flex items-center justify-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        執行回測
                    </button>
                    <button id="add-to-compare" class="bg-white border-2 border-green-500 text-green-600 py-3 px-4 rounded-lg font-medium hover:bg-green-50 transition-all duration-300" title="加入比較清單">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                        </svg>
                    </button>
                </div>

                <!-- 多組公式比較區 -->
                <div id="formula-compare-section" class="bg-white rounded-xl shadow-sm p-6 card-hover transition-all duration-300">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-gray-800 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path>
                            </svg>
                            多組公式比較
                            <span id="formula-count" class="ml-2 bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full">0 組</span>
                        </h2>
                        <div class="flex items-center space-x-2">
                            <button id="add-new-formula" class="bg-green-500 text-white px-3 py-1 rounded-lg text-sm hover:bg-green-600 flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                                </svg>
                                新增公式
                            </button>
                            <button id="clear-formulas" class="text-red-500 hover:text-red-700 text-sm">清空</button>
                        </div>
                    </div>
                    
                    <div id="formula-list" class="space-y-3 max-h-[500px] overflow-y-auto mb-4">
                        <p id="formula-empty-hint" class="text-gray-400 text-sm text-center py-4">點擊「新增公式」開始設定比較組合</p>
                    </div>
                    
                    <button id="run-compare" class="w-full bg-gradient-to-r from-green-500 to-teal-600 text-white py-3 px-6 rounded-lg font-medium hover:from-green-600 hover:to-teal-700 transition-all duration-300 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                        執行多組比較
                    </button>
                </div>

                <!-- 預設方法快速比較 -->
                <div class="flex">
                    <button id="compare-methods" class="w-full bg-white border-2 border-indigo-500 text-indigo-600 py-3 px-6 rounded-lg font-medium hover:bg-indigo-50 transition-all duration-300">
                        快速比較預設方法（11 種，含需求計劃公式）
                    </button>
                </div>
            </div>

            <!-- 右側：結果顯示 -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 公式說明 -->
                <div id="formula-info" class="formula-box p-6 text-white">
                    <h3 id="formula-name" class="text-xl font-bold mb-2">SMA (簡單移動平均)</h3>
                    <div class="bg-white/20 rounded-lg p-4 mb-3">
                        <code id="formula-text" class="text-lg font-mono">預測值 = (過去 N 期銷量加總) / N</code>
                    </div>
                    <p id="formula-desc" class="text-white/90 text-sm">對所有歷史數據權重相同，平滑短期波動</p>
                    <p id="formula-suitable" class="text-white/70 text-xs mt-2">適用：需求波動小的成熟商品</p>
                </div>

                <!-- 結果來源（現成紀錄或剛計算） -->
                <div id="result-banner" class="hidden rounded-lg px-4 py-3 text-sm flex flex-wrap items-center justify-between gap-2"></div>

                <!-- 方法排名 -->
                <div id="ranking-panel" class="bg-white rounded-xl shadow-sm p-6 hidden"></div>

                <!-- 單一方法明細（結果解讀、指標、圖表、逐輪明細） -->
                <div id="detail-panel" class="space-y-6 hidden"></div>

                <div id="empty-hint" class="bg-white rounded-xl shadow-sm p-6 text-sm text-gray-500">
                    選擇資料與對象後，按「執行回測」看單一方法，或按「快速比較」一次比較 11 種方法（含需求計劃公式）。
                    跑過的結果會自動存到「回測紀錄」，下次同樣的查詢會直接顯示，不必重跑。
                </div>

                <div id="guide-panel"></div>
            </div>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl p-8 flex flex-col items-center">
            <div class="loading-spinner mb-4"></div>
            <p class="text-gray-600">執行回測中...</p>
        </div>
    </div>

    <!-- 公式參數設定彈窗 -->
    <div id="formula-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 max-h-[90vh] overflow-hidden">
            <!-- 彈窗標題 -->
            <div class="bg-gradient-to-r from-green-500 to-teal-600 text-white px-6 py-4 flex items-center justify-between">
                <h3 id="modal-title" class="text-lg font-bold flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    公式參數設定
                </h3>
                <button onclick="closeFormulaModal()" class="text-white/80 hover:text-white p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <!-- 彈窗內容 -->
            <div class="p-6 overflow-y-auto max-h-[60vh]">
                <!-- 方法選擇 -->
                <div class="mb-5">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">📊 預測方法</label>
                    <select id="modal-method-select" onchange="onModalMethodChange()" 
                            class="w-full px-4 py-3 text-base border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 bg-white">
                    </select>
                </div>
                
                <!-- 參數設定區 -->
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">⚙️ 參數設定</label>
                    <div id="modal-params-container" class="bg-gray-50 rounded-xl p-4 space-y-4">
                        <!-- 動態生成參數控制項 -->
                    </div>
                </div>
            </div>
            
            <!-- 彈窗底部按鈕 -->
            <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="closeFormulaModal()" class="px-5 py-2.5 text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 font-medium">
                    取消
                </button>
                <button onclick="saveFormulaModal()" class="px-5 py-2.5 text-white bg-gradient-to-r from-green-500 to-teal-600 rounded-lg hover:from-green-600 hover:to-teal-700 font-medium">
                    確定
                </button>
            </div>
        </div>
    </div>

    <script>
        // 全域變數
        let formulaInfo = {};
        let datasetInfo = {};

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                document.getElementById('guide-panel').innerHTML = BV.guideHTML();
                await loadDataInfo();
                document.getElementById('dataset-select').addEventListener('change', loadDataInfo);
                await loadFormulaInfo();
                setupEventListeners();
                updateMethodParams();
            } catch (e) {
                console.error('初始化錯誤:', e);
            }
        });

        // 載入數據資訊
        async function loadDataInfo() {
            try {
                const dataset = document.getElementById('dataset-select').value;
                const response = await fetch('/api/data/info?dataset=' + dataset);
                const data = await response.json();
                if (data.error) { alert(data.error); return; }
                datasetInfo = data;
                const meta = data.datasets?.[dataset] || {};
                document.getElementById('series-label').textContent =
                    meta.item_label === '料號' ? '料號（近 12 個月銷量前 150）' : '商品系列';
                
                // 載入通路選單
                if (data.channels) {
                    const channelSelect = document.getElementById('channel-select');
                    const channelNames = data.channel_names || {};
                    channelSelect.innerHTML = data.channels.map(ch => 
                        `<option value="${ch}">${channelNames[ch] || ch}</option>`
                    ).join('');
                }
                
                // 載入系列選單
                if (data.series) {
                    const seriesSelect = document.getElementById('series-select');
                    seriesSelect.innerHTML = data.series.map(s => 
                        `<option value="${s.key}">${s.name}</option>`
                    ).join('');
                }
                
                document.getElementById('data-info').textContent = 
                    `數據: ${data.year_range[0]}-${data.data_end || data.year_range[1]} | 記錄: ${data.total_records?.toLocaleString() || '-'}${meta.unit ? ' | 單位: ' + meta.unit : ''}`;
            } catch (e) {
                console.error('載入數據資訊失敗:', e);
            }
        }

        // 載入公式資訊
        async function loadFormulaInfo() {
            try {
                const response = await fetch('/api/formula/info');
                formulaInfo = await response.json();
            } catch (e) {
                console.error('載入公式資訊失敗:', e);
            }
        }

        // 多組公式比較清單
        let formulaCompareList = [];
        
        // 彈窗狀態
        let currentEditingFormulaId = null;
        let modalTempParams = {};

        // 設定事件監聽器
        function setupEventListeners() {
            // 滑桿值更新
            ['training-months', 'forecast-months', 'rolling-rounds'].forEach(id => {
                const slider = document.getElementById(id);
                const valueSpan = document.getElementById(`${id}-value`);
                if (slider && valueSpan) {
                    slider.addEventListener('input', () => valueSpan.textContent = slider.value);
                }
            });

            // 方法選擇變更
            document.querySelectorAll('input[name="method"]').forEach(radio => {
                radio.addEventListener('change', updateMethodParams);
            });

            // 按鈕事件綁定
            document.getElementById('run-backtest')?.addEventListener('click', runBacktest);
            document.getElementById('compare-methods')?.addEventListener('click', compareMethods);
            document.getElementById('add-to-compare')?.addEventListener('click', addCurrentToCompareList);
            document.getElementById('add-new-formula')?.addEventListener('click', openNewFormulaModal);
            document.getElementById('clear-formulas')?.addEventListener('click', clearCompareList);
            document.getElementById('run-compare')?.addEventListener('click', runMultiCompare);
        }
        
        // 使用當前設定加入比較清單
        function addCurrentToCompareList() {
            const method = document.querySelector('input[name="method"]:checked').value;
            const params = getCurrentParams();
            addFormulaToList(method, params);
        }
        
        // 開啟新增公式彈窗
        function openNewFormulaModal() {
            currentEditingFormulaId = null; // 新增模式
            modalTempParams = {};
            
            // 初始化彈窗方法選單
            const methodSelect = document.getElementById('modal-method-select');
            methodSelect.innerHTML = Object.keys(formulaInfo).map(key => {
                const info = formulaInfo[key];
                return `<option value="${key}">${info.name}</option>`;
            }).join('');
            
            // 預設選擇 SMA
            methodSelect.value = 'SMA';
            onModalMethodChange();
            
            // 顯示彈窗
            document.getElementById('modal-title').innerHTML = `
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                </svg>
                新增公式
            `;
            document.getElementById('formula-modal').classList.remove('hidden');
        }
        
        // 開啟編輯公式彈窗
        function openEditFormulaModal(id) {
            const item = formulaCompareList.find(f => f.id === id);
            if (!item) return;
            
            currentEditingFormulaId = id;
            modalTempParams = { ...item.params };
            
            // 初始化彈窗方法選單
            const methodSelect = document.getElementById('modal-method-select');
            methodSelect.innerHTML = Object.keys(formulaInfo).map(key => {
                const info = formulaInfo[key];
                return `<option value="${key}" ${key === item.method ? 'selected' : ''}>${info.name}</option>`;
            }).join('');
            
            // 載入參數
            onModalMethodChange();
            
            // 顯示彈窗
            document.getElementById('modal-title').innerHTML = `
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                編輯公式參數
            `;
            document.getElementById('formula-modal').classList.remove('hidden');
        }
        
        // 關閉彈窗
        function closeFormulaModal() {
            document.getElementById('formula-modal').classList.add('hidden');
            currentEditingFormulaId = null;
            modalTempParams = {};
        }
        
        // 彈窗方法變更
        function onModalMethodChange() {
            const method = document.getElementById('modal-method-select').value;
            const info = formulaInfo[method];
            const container = document.getElementById('modal-params-container');
            
            // 如果是編輯模式且方法相同，使用已存的參數
            let params = {};
            if (currentEditingFormulaId !== null) {
                const item = formulaCompareList.find(f => f.id === currentEditingFormulaId);
                if (item && item.method === method) {
                    params = { ...item.params };
                }
            }
            
            // 合併暫存參數
            if (modalTempParams && Object.keys(modalTempParams).length > 0) {
                const prevMethod = document.getElementById('modal-method-select').dataset.prevMethod;
                if (prevMethod === method) {
                    params = { ...modalTempParams };
                }
            }
            
            // 記錄當前方法
            document.getElementById('modal-method-select').dataset.prevMethod = method;
            
            if (!info || !info.params || info.params.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm text-center py-2">此方法無需額外參數</p>';
                modalTempParams = {};
                return;
            }
            
            // 初始化參數
            modalTempParams = {};
            info.params.forEach(p => {
                if (params[p.name] !== undefined) {
                    modalTempParams[p.name] = params[p.name];
                } else {
                    modalTempParams[p.name] = p.default;
                }
            });
            
            // 生成參數控制項
            container.innerHTML = info.params.map(param => {
                const value = modalTempParams[param.name];
                
                if (param.options) {
                    return `
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">${param.label}</label>
                            <select onchange="updateModalParam('${param.name}', this.value)" 
                                    class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 bg-white">
                                ${param.options.map(opt => 
                                    `<option value="${opt}" ${opt === value ? 'selected' : ''}>${opt === 'add' ? '加法模型' : '乘法模型'}</option>`
                                ).join('')}
                            </select>
                        </div>
                    `;
                } else if (param.type === 'checkbox') {
                    return `
                        <div class="flex items-center p-3 bg-white rounded-lg border border-gray-200">
                            <input type="checkbox" id="modal-param-${param.name}" ${value ? 'checked' : ''}
                                   onchange="updateModalParam('${param.name}', this.checked)"
                                   class="w-5 h-5 text-green-600 border-gray-300 rounded focus:ring-green-500">
                            <label for="modal-param-${param.name}" class="ml-3 text-sm font-medium text-gray-700">${param.label}</label>
                        </div>
                    `;
                } else {
                    return `
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-sm font-medium text-gray-700">${param.label}</label>
                                <span id="modal-param-${param.name}-val" class="text-sm text-green-600 font-bold bg-green-100 px-3 py-1 rounded-full">${value}</span>
                            </div>
                            <input type="range" min="${param.min}" max="${param.max}" value="${value}" step="${param.step}"
                                   onchange="updateModalParam('${param.name}', parseFloat(this.value)); document.getElementById('modal-param-${param.name}-val').textContent = this.value;"
                                   oninput="document.getElementById('modal-param-${param.name}-val').textContent = this.value;"
                                   class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-green-500">
                        </div>
                    `;
                }
            }).join('');
        }
        
        // 更新彈窗參數
        function updateModalParam(paramName, value) {
            const method = document.getElementById('modal-method-select').value;
            const info = formulaInfo[method];
            if (info && info.params) {
                const paramDef = info.params.find(p => p.name === paramName);
                if (paramDef) {
                    if (paramDef.type === 'checkbox') {
                        value = Boolean(value);
                    } else if (paramDef.step && paramDef.step >= 1) {
                        value = parseInt(value);
                    } else if (!paramDef.options) {
                        value = parseFloat(value);
                    }
                }
            }
            modalTempParams[paramName] = value;
        }
        
        // 儲存彈窗設定
        function saveFormulaModal() {
            const method = document.getElementById('modal-method-select').value;
            
            if (currentEditingFormulaId === null) {
                // 新增模式
                const id = Date.now();
                const formulaItem = {
                    id: id,
                    method: method,
                    params: { ...modalTempParams }
                };
                formulaCompareList.push(formulaItem);
            } else {
                // 編輯模式
                const item = formulaCompareList.find(f => f.id === currentEditingFormulaId);
                if (item) {
                    item.method = method;
                    item.params = { ...modalTempParams };
                }
            }
            
            updateFormulaListUI();
            closeFormulaModal();
        }
        
        // 加入公式到清單
        function addFormulaToList(method, params) {
            const formulaItem = {
                id: Date.now(),
                method: method,
                params: { ...params },
                expanded: false
            };
            
            formulaCompareList.push(formulaItem);
            updateFormulaListUI();
        }
        
        // 取得公式顯示名稱
        function getFormulaDisplayName(method, params) {
            const info = formulaInfo[method];
            let name = info ? info.name.split(' ')[0] : method;
            
            // 根據方法加入參數說明
            if (method === 'SMA') {
                name += ` (window=${params.window || 3})`;
            } else if (method === 'SES') {
                name += ` (α=${params.alpha || 0.2})`;
            } else if (method === 'Holt') {
                name += ` (α=${params.alpha || 0.2}, β=${params.beta || 0.1})`;
            } else if (method === 'HoltWinters') {
                name += ` (${params.seasonal_type || 'add'})`;
            } else if (method === 'WeightedMA') {
                const w = params.sell_in_weight !== undefined ? params.sell_in_weight : 0.7;
                name += ` (MA${params.ma_period_1 || 12}-${params.ma_period_2 || 6}-${params.ma_period_3 || 3}, SI:${w})`;
            } else if (method === 'Seasonal_Naive') {
                name += ` (period=${params.seasonal_period || 12})`;
            }
            
            return name;
        }
        
        // 取得公式參數摘要（用於卡片副標題）
        function getFormulaParamsSummary(method, params) {
            const info = formulaInfo[method];
            if (!info || !info.params || info.params.length === 0) {
                return '無額外參數';
            }
            
            const summaryParts = [];
            info.params.forEach(param => {
                const value = params[param.name] !== undefined ? params[param.name] : param.default;
                if (param.type === 'checkbox') {
                    if (value) summaryParts.push(`✓ ${param.label.substring(0, 10)}`);
                } else if (param.options) {
                    summaryParts.push(`${value === 'add' ? '加法' : '乘法'}`);
                } else {
                    // 縮短標籤
                    let shortLabel = param.label.replace(/\s*\(.*\)/, '').substring(0, 6);
                    summaryParts.push(`${shortLabel}=${value}`);
                }
            });
            
            return summaryParts.slice(0, 4).join(' | ') + (summaryParts.length > 4 ? ' ...' : '');
        }
        
        // 生成公式卡片的參數 HTML
        function generateFormulaParamsHTML(id, method, params) {
            const info = formulaInfo[method];
            if (!info || !info.params || info.params.length === 0) {
                return '<p class="text-gray-500 text-xs">此方法無需額外參數</p>';
            }
            
            // 將參數分組顯示（針對 WeightedMA 等多參數公式）
            const paramGroups = [];
            let currentGroup = [];
            
            info.params.forEach((param, idx) => {
                currentGroup.push(param);
                // 每 3 個滑桿參數或遇到 checkbox/select 時分組
                if (param.type === 'checkbox' || param.options || currentGroup.length >= 3) {
                    paramGroups.push([...currentGroup]);
                    currentGroup = [];
                }
            });
            if (currentGroup.length > 0) {
                paramGroups.push(currentGroup);
            }
            
            return paramGroups.map(group => {
                const groupHTML = group.map(param => {
                    const value = params[param.name] !== undefined ? params[param.name] : param.default;
                    
                    if (param.options) {
                        return `
                            <div class="mb-3">
                                <label class="block text-xs font-medium text-gray-600 mb-1">${param.label}</label>
                                <select onchange="updateFormulaParam(${id}, '${param.name}', this.value)" 
                                        class="w-full px-2 py-1.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 bg-white">
                                    ${param.options.map(opt => 
                                        `<option value="${opt}" ${opt === value ? 'selected' : ''}>${opt === 'add' ? '加法模型' : '乘法模型'}</option>`
                                    ).join('')}
                                </select>
                            </div>
                        `;
                    } else if (param.type === 'checkbox') {
                        return `
                            <div class="flex items-center p-2 bg-gray-50 rounded-lg mb-3">
                                <input type="checkbox" id="formula-${id}-${param.name}" ${value ? 'checked' : ''}
                                       onchange="updateFormulaParam(${id}, '${param.name}', this.checked)"
                                       class="w-4 h-4 text-green-600 border-gray-300 rounded focus:ring-green-500">
                                <label for="formula-${id}-${param.name}" class="ml-2 text-xs font-medium text-gray-700">${param.label}</label>
                            </div>
                        `;
                    } else {
                        return `
                            <div class="mb-3">
                                <div class="flex justify-between items-center mb-1">
                                    <label class="text-xs font-medium text-gray-600">${param.label}</label>
                                    <span id="formula-${id}-${param.name}-val" class="text-sm text-green-600 font-bold bg-green-50 px-2 py-0.5 rounded">${value}</span>
                                </div>
                                <input type="range" min="${param.min}" max="${param.max}" value="${value}" step="${param.step}"
                                       onchange="updateFormulaParam(${id}, '${param.name}', parseFloat(this.value)); document.getElementById('formula-${id}-${param.name}-val').textContent = this.value;"
                                       oninput="document.getElementById('formula-${id}-${param.name}-val').textContent = this.value;"
                                       class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-green-500">
                            </div>
                        `;
                    }
                }).join('');
                
                // 如果是多個滑桿參數，用網格佈局
                if (group.length > 1 && group.every(p => !p.options && p.type !== 'checkbox')) {
                    return `<div class="grid grid-cols-${Math.min(group.length, 3)} gap-2">${groupHTML}</div>`;
                }
                return groupHTML;
            }).join('');
        }
        
        // 更新公式參數
        function updateFormulaParam(id, paramName, value) {
            const item = formulaCompareList.find(f => f.id === id);
            if (item) {
                // 根據參數類型轉換值
                const info = formulaInfo[item.method];
                if (info && info.params) {
                    const paramDef = info.params.find(p => p.name === paramName);
                    if (paramDef) {
                        if (paramDef.type === 'checkbox') {
                            value = Boolean(value);
                        } else if (paramDef.step && paramDef.step >= 1) {
                            value = parseInt(value);
                        } else if (!paramDef.options) {
                            value = parseFloat(value);
                        }
                    }
                }
                item.params[paramName] = value;
                // 更新卡片標題
                const titleEl = document.getElementById(`formula-title-${id}`);
                if (titleEl) {
                    titleEl.textContent = getFormulaDisplayName(item.method, item.params);
                }
            }
        }
        
        // 更新公式方法
        function updateFormulaMethod(id, method) {
            const item = formulaCompareList.find(f => f.id === id);
            if (item) {
                item.method = method;
                // 重設參數為預設值
                const info = formulaInfo[method];
                item.params = {};
                if (info && info.params) {
                    info.params.forEach(p => {
                        // 確保參數類型正確
                        if (p.type === 'checkbox') {
                            item.params[p.name] = Boolean(p.default);
                        } else if (p.step && p.step >= 1) {
                            item.params[p.name] = parseInt(p.default);
                        } else if (p.options) {
                            item.params[p.name] = p.default;
                        } else {
                            item.params[p.name] = parseFloat(p.default);
                        }
                    });
                }
                // 重新渲染參數區
                const paramsContainer = document.getElementById(`formula-params-${id}`);
                if (paramsContainer) {
                    paramsContainer.innerHTML = generateFormulaParamsHTML(id, method, item.params);
                }
                // 更新標題
                const titleEl = document.getElementById(`formula-title-${id}`);
                if (titleEl) {
                    titleEl.textContent = getFormulaDisplayName(method, item.params);
                }
            }
        }
        
        // 更新公式清單 UI（簡潔卡片模式，點擊打開彈窗編輯）
        function updateFormulaListUI() {
            const container = document.getElementById('formula-list');
            const countSpan = document.getElementById('formula-count');
            const runBtn = document.getElementById('run-compare');
            
            countSpan.textContent = `${formulaCompareList.length} 組`;
            runBtn.disabled = formulaCompareList.length < 2;
            
            if (formulaCompareList.length === 0) {
                container.innerHTML = '<p id="formula-empty-hint" class="text-gray-400 text-sm text-center py-4">點擊「新增公式」開始設定比較組合</p>';
                return;
            }
            
            container.innerHTML = formulaCompareList.map((item, index) => `
                <div id="formula-card-${item.id}" class="group border border-gray-200 rounded-xl overflow-hidden bg-white hover:border-green-400 hover:shadow-md transition-all duration-200 cursor-pointer" onclick="openEditFormulaModal(${item.id})">
                    <div class="flex items-center justify-between p-4">
                        <div class="flex items-center flex-1 min-w-0">
                            <span class="w-8 h-8 bg-gradient-to-br from-green-500 to-teal-600 text-white text-sm rounded-full flex items-center justify-center mr-3 font-bold shadow-sm flex-shrink-0">${index + 1}</span>
                            <div class="min-w-0 flex-1">
                                <div id="formula-title-${item.id}" class="text-sm font-semibold text-gray-800 truncate">${getFormulaDisplayName(item.method, item.params)}</div>
                                <div class="text-xs text-gray-500 mt-0.5">${getFormulaParamsSummary(item.method, item.params)}</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 ml-3 flex-shrink-0">
                            <button onclick="event.stopPropagation(); openEditFormulaModal(${item.id})" class="text-gray-400 hover:text-green-600 p-1.5 rounded-lg hover:bg-green-50 transition-colors" title="編輯參數">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                            </button>
                            <button onclick="event.stopPropagation(); removeFromCompareList(${item.id})" class="text-gray-400 hover:text-red-600 p-1.5 rounded-lg hover:bg-red-50 transition-colors" title="移除">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // 從比較清單移除
        function removeFromCompareList(id) {
            formulaCompareList = formulaCompareList.filter(item => item.id !== id);
            updateFormulaListUI();
        }
        
        // 清空比較清單
        function clearCompareList() {
            formulaCompareList = [];
            updateFormulaListUI();
        }
        
        // 執行多組比較
        async function runMultiCompare() {
            if (formulaCompareList.length < 2) {
                alert('請至少加入 2 組公式進行比較');
                return;
            }
            const methods = formulaCompareList.map(item => ({ method: item.method, params: item.params }));
            const q = currentQuery('compare', methods);
            await runWithRecords(q, () => computeCompare(q, methods));
        }

        // 更新方法參數
        function updateMethodParams() {
            const method = document.querySelector('input[name="method"]:checked').value;
            const info = formulaInfo[method];
            
            if (info) {
                document.getElementById('formula-name').textContent = info.name;
                document.getElementById('formula-text').textContent = info.formula;
                document.getElementById('formula-desc').textContent = info.description;
                document.getElementById('formula-suitable').textContent = `適用：${info.suitable_for}`;
                
                // 生成參數控制項
                const container = document.getElementById('params-container');
                if (info.params && info.params.length > 0) {
                    container.innerHTML = info.params.map(param => {
                        if (param.options) {
                            return `
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">${param.label}</label>
                                    <select id="param-${param.name}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                        ${param.options.map(opt => 
                                            `<option value="${opt}" ${opt === param.default ? 'selected' : ''}>${opt === 'add' ? '加法模型' : '乘法模型'}</option>`
                                        ).join('')}
                                    </select>
                                </div>
                            `;
                        } else if (param.type === 'checkbox') {
                            return `
                                <div class="flex items-center p-3 bg-gray-50 rounded-lg">
                                    <input type="checkbox" id="param-${param.name}" ${param.default ? 'checked' : ''}
                                           class="w-4 h-4 text-green-600 border-gray-300 rounded focus:ring-green-500">
                                    <label for="param-${param.name}" class="ml-3 text-sm font-medium text-gray-700">${param.label}</label>
                                </div>
                            `;
                        } else {
                            return `
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">
                                        ${param.label}
                                        <span id="param-${param.name}-value" class="text-indigo-600 font-semibold ml-2">${param.default}</span>
                                    </label>
                                    <input type="range" id="param-${param.name}" 
                                           min="${param.min}" max="${param.max}" value="${param.default}" step="${param.step}"
                                           class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer param-slider">
                                </div>
                            `;
                        }
                    }).join('');
                    
                    // 綁定滑桿事件
                    info.params.forEach(param => {
                        if (!param.options) {
                            const slider = document.getElementById(`param-${param.name}`);
                            const valueSpan = document.getElementById(`param-${param.name}-value`);
                            if (slider && valueSpan) {
                                slider.addEventListener('input', () => {
                                    valueSpan.textContent = slider.value;
                                });
                            }
                        }
                    });
                } else {
                    container.innerHTML = '<p class="text-gray-500 text-sm">此方法無需額外參數</p>';
                }
            }
        }

        // 取得當前參數
        function getCurrentParams() {
            const method = document.querySelector('input[name="method"]:checked').value;
            const info = formulaInfo[method];
            const params = {};
            
            if (info && info.params) {
                info.params.forEach(param => {
                    const el = document.getElementById(`param-${param.name}`);
                    if (el) {
                        if (param.type === 'checkbox') {
                            params[param.name] = el.checked;
                        } else if (param.options) {
                            params[param.name] = el.value;
                        } else {
                            params[param.name] = parseFloat(el.value);
                        }
                    }
                });
            }
            
            return params;
        }

        // 執行回測（單一方法）
        async function runBacktest() {
            const method = document.querySelector('input[name="method"]:checked').value;
            const params = getCurrentParams();
            const q = currentQuery('single', [{ method, params }]);
            await runWithRecords(q, async () => {
                const result = await postJSON('/api/backtest/run', requestBody(q, { method, params }));
                if (result.error) { alert(result.error); return null; }
                const out = { backtest_period: result.backtest_period, results: [BV.compact(result)] };
                // 有共用回測總表時，附上同一對象各方法的指標作為比較基準（不含逐輪明細）
                const hit = await BV.findShared(q.dataset, q.channel, q.series, q.config, q.data_end);
                if (hit) out.reference = hit.entry.results.map(r => ({ label: r.label, method: r.method, overall: r.overall }));
                return out;
            });
        }

        // 快速比較預設方法（方法組合由伺服器提供，與共用回測總表相同）
        async function compareMethods() {
            const q = currentQuery('compare', 'default');
            await runWithRecords(q, () => computeCompare(q, null));
        }

        // ---------- 顯示結果（共用模組 static/backtest_view.js） ----------
        let currentView = null;   // {record, ctx}

        function currentQuery(kind, methods) {
            const datasetSel = document.getElementById('dataset-select');
            const seriesSel = document.getElementById('series-select');
            const channelSel = document.getElementById('channel-select');
            return {
                kind,
                dataset: datasetSel.value,
                dataset_label: datasetInfo.datasets?.[datasetSel.value]?.label || '',
                unit: datasetInfo.datasets?.[datasetSel.value]?.unit || '元',
                channel: channelSel.value,
                channel_name: channelSel.selectedOptions[0]?.text || channelSel.value,
                series: seriesSel.value,
                series_name: seriesSel.selectedOptions[0]?.text || seriesSel.value,
                config: {
                    training_months: parseInt(document.getElementById('training-months').value),
                    forecast_months: parseInt(document.getElementById('forecast-months').value),
                    rolling_rounds: parseInt(document.getElementById('rolling-rounds').value)
                },
                methods,
                data_end: datasetInfo.data_end
            };
        }

        function querySignature(q) {
            return BV.signature([q.kind, q.dataset, q.channel, q.series, q.config, q.methods, q.data_end]);
        }

        function showBanner(html, recompute) {
            const el = document.getElementById('result-banner');
            el.className = 'rounded-lg px-4 py-3 text-sm flex flex-wrap items-center justify-between gap-2 ' +
                (recompute ? 'bg-amber-50 text-amber-800' : 'bg-green-50 text-green-800');
            el.innerHTML = `<span>${html}</span>` +
                (recompute ? '<button class="px-3 py-1 rounded bg-white border border-amber-300 hover:bg-amber-100">重新計算</button>' : '');
            el.querySelector('button')?.addEventListener('click', recompute);
            el.classList.remove('hidden');
        }

        /** 先找現成紀錄（我的紀錄 → 共用回測總表），沒有才呼叫 compute() 計算並存成紀錄 */
        async function runWithRecords(query, compute, force = false) {
            const sig = querySignature(query);
            if (!force) {
                const mine = await BV.Records.find(sig);
                if (mine) {
                    showRecord(mine);
                    showBanner(`這是 ${BV.esc(mine.created_at)} 跑過的結果（我的紀錄），不必重跑。`, () => runWithRecords(query, compute, true));
                    return;
                }
                if (query.kind === 'compare' && query.methods === 'default') {
                    const hit = await BV.findShared(query.dataset, query.channel, query.series, query.config, query.data_end);
                    if (hit) {
                        showRecord({ ...query, signature: sig, backtest_period: hit.entry.backtest_period, results: hit.entry.results, source: 'shared' });
                        showBanner(`這是共用回測總表的結果（資料更新於 ${BV.esc(hit.shared.data_updated)}），不必重跑。部分方法的逐輪明細點選時才計算。`,
                                   () => runWithRecords(query, compute, true));
                        return;
                    }
                }
            }
            showLoading(true);
            try {
                const out = await compute();
                if (!out) return;
                const record = { ...query, signature: sig, ...out };
                showRecord(record);
                const saved = await BV.Records.save(record);
                showBanner(saved ? '已完成並存到「回測紀錄」，下次同樣的查詢會直接顯示。' : '已完成（瀏覽器無法儲存，未存入紀錄）。');
            } catch (e) {
                console.error('回測失敗:', e);
                alert('回測執行失敗');
            } finally {
                showLoading(false);
            }
        }

        async function postJSON(url, body) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            return response.json();
        }

        function requestBody(q, extra) {
            return { dataset: q.dataset, channel: q.channel, series: q.series, backtest_config: q.config, ...extra };
        }

        async function computeCompare(q, methods) {
            const result = await postJSON('/api/backtest/compare', requestBody(q, { methods }));
            if (result.error) { alert(result.error); return null; }
            return {
                backtest_period: result.results[0].backtest_period,
                results: result.results.map(BV.compact),
                skipped: result.skipped || []
            };
        }

        /** 顯示一筆紀錄：多種方法 → 排名 + 最準方法明細；單一方法 → 明細 */
        function showRecord(record) {
            document.getElementById('empty-hint').classList.add('hidden');
            const results = record.results;
            const pool = results.length > 1 ? results : (record.reference || []);
            const formula = results.find(r => r.method === BV.FORMULA) || pool.find(r => r.method === BV.FORMULA);
            const target = [record.channel_name || record.channel, record.series_name || record.series]
                .filter(x => x && x !== 'ALL').join(' / ') || '全部';
            const ctx = {
                unit: record.unit, config: record.config, results: pool, best: pool[0], formula,
                period: record.backtest_period?.replace(/(\d{4}-\d{2})-01/g, '$1').replace(' ~ ', '～'),
                skipped: record.skipped,
                subtitle: `${record.dataset_label || ''}｜${target}`
            };
            currentView = { record, ctx };
            const ranking = document.getElementById('ranking-panel');
            if (results.length > 1) {
                BV.renderRanking(ranking, results, ctx, r => showDetail(r));
                ranking.classList.remove('hidden');
            } else {
                ranking.classList.add('hidden');
            }
            showDetail(results[0]);
        }

        async function showDetail(r) {
            const { record, ctx } = currentView;
            if (!r.rounds) {
                // 共用回測總表只存最準方法與需求計劃公式的逐輪明細，其他方法點選時再算
                showLoading(true);
                try {
                    const res = await postJSON('/api/backtest/run', requestBody(record, { method: r.method, params: r.params }));
                    if (res.error) { alert(res.error); return; }
                    r.rounds = BV.compact(res).rounds;
                } finally {
                    showLoading(false);
                }
            }
            const panel = document.getElementById('detail-panel');
            BV.renderDetail(panel, r, ctx);
            panel.classList.remove('hidden');
        }

        // 顯示/隱藏 Loading
        function showLoading(show) {
            document.getElementById('loading-overlay').classList.toggle('hidden', !show);
        }
    </script>
</body>
</html>
